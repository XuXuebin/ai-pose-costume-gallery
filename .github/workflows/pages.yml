name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # configure-pages 的 enablement 需要它来自动开启 Pages
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时自动开启（build_type = workflow）
          enablement: true

      - name: Verify assets
        run: python3 tools/verify.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布站点所需内容，避免把 .git 一起打包
          path: |
            index.html
            studio
            galleries
            data

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
