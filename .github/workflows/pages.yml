name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时自动开启（build_type = workflow）
          enablement: true

      - name: Verify assets
        run: python3 tools/verify.py

      - name: Prepare site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for p in index.html studio galleries data; do
            if [ ! -e "$p" ]; then echo "::error::缺少发布目录 $p"; exit 1; fi
            cp -R "$p" _site/
          done
          echo "待发布体积：$(du -sh _site | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # upload-pages-artifact 只接受单个路径，先用上一步暂存好
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
